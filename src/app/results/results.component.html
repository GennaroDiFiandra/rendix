<div class="overflow-x-auto">
  <table>
    <caption>
      Month by Month Investment Result
    </caption>
    <thead>
      <tr>
        <th>Month</th>
        <th>Start Amount</th>
        <th>Gain</th>
        <th>New Amount</th>
      </tr>
    </thead>
    <tbody class="[&>tr:nth-child(2n+1)]:bg-zinc-700 [&>tr:nth-child(2n)]:bg-zinc-600">
      @for (data of results(); track $index) {
      <tr>
        <td class="text-end">{{ $index + 1 }}</td>
        <td class="text-end">{{ data[0] | number : '1.2-2' }}</td>
        <td class="text-end">{{ data[1] | number : '1.2-2' }}</td>
        <td class="text-end">{{ data[2] | number : '1.2-2' }}</td>
      </tr>
      }
    </tbody>
  </table>
</div>
